<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아빠의 퀘스트 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#0b3350; --sea-mid:#1a5b86; --sea-light:#2e7fab;
    --wood:#5a3a24; --wood-dark:#3d2716;
    --parchment:#efe2c2; --parchment-dark:#ddc794;
    --ink:#2c1c10; --rope:#c9a05c; --gold:#d4af37; --sand:#e6c98a;
    --wrong:#8b2e2e; --right:#2e6b3e; --locked:#7d8a91;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--sea-mid), var(--sea-deep) 60%);
    font-family:'Nanum Myeongjo', serif; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:24px 14px; overflow-x:hidden;
  }
  .stage{ width:100%; max-width:420px; position:relative; }
  .plank-frame{
    background: repeating-linear-gradient(90deg, var(--wood) 0 54px, var(--wood-dark) 54px 58px);
    border-radius:18px; padding:10px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.25);
  }
  .card{
    background: linear-gradient(180deg, var(--parchment), var(--parchment-dark));
    border-radius:12px; padding:22px 18px 26px; position:relative;
    box-shadow: inset 0 0 40px rgba(90,58,36,.25);
    min-height: 520px; display:flex; flex-direction:column;
  }
  .card::before{
    content:""; position:absolute; inset:8px;
    border:1px dashed rgba(44,28,16,.35); border-radius:8px; pointer-events:none;
  }
  .eyebrow{ font-family:'Black Han Sans', sans-serif; letter-spacing:2px; font-size:12px; color:var(--wood-dark); opacity:.75; text-align:center; margin-bottom:4px; }
  h1{ font-family:'Black Han Sans', sans-serif; font-size:22px; text-align:center; margin:2px 0 12px; color:var(--ink); line-height:1.35; }
  .rope-divider{
    height:10px; margin:6px 0 16px;
    background-image: radial-gradient(circle, var(--rope) 2.5px, transparent 2.8px);
    background-size: 14px 10px; background-repeat: repeat-x; opacity:.8;
  }
  .btn{
    display:block; width:100%; font-family:'Black Han Sans', sans-serif; font-size:16px;
    letter-spacing:1px; padding:14px 10px; border:none; border-radius:9px; cursor:pointer;
    background:linear-gradient(180deg, #a9702f, #7c4d1e); color:#fff8e8;
    box-shadow:0 6px 0 #4d3012, 0 10px 18px rgba(0,0,0,.35);
    transition: transform .08s ease;
  }
  .btn:active{ transform: translateY(4px); box-shadow:0 2px 0 #4d3012; }
  .btn.secondary{
    background:linear-gradient(180deg, #2c6a4a, #1d4a33);
    box-shadow:0 6px 0 #123322, 0 10px 18px rgba(0,0,0,.35); margin-top:10px;
  }
  .btn.secondary:active{ box-shadow:0 2px 0 #123322; }

  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }

  /* ===== MAP (스크롤형) ===== */
  .map-outer{
    position:relative; width:100%; height:380px; border-radius:10px; overflow:hidden;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.15), inset 0 8px 20px rgba(0,0,0,.2);
    margin-bottom:14px;
    background: linear-gradient(180deg, var(--sea-light), var(--sea-mid) 40%, var(--sea-deep));
  }
  .map-scroll{
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling: touch;
  }
  .map-world{ position:relative; width:100%; }
  .map-world svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .progress-badge{
    position:absolute; top:8px; right:8px; z-index:6;
    background:rgba(11,51,80,.85); color:#efe2c2; font-family:'Black Han Sans', sans-serif;
    font-size:11px; padding:5px 10px; border-radius:20px; letter-spacing:1px;
  }
  .island{
    position:absolute; width:52px; height:52px; transform: translate(-50%,-50%);
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family:'Black Han Sans', sans-serif; cursor:pointer; border:3px solid var(--wood-dark);
    background: radial-gradient(circle at 35% 30%, #f4dfa0, var(--sand));
    box-shadow:0 6px 14px rgba(0,0,0,.35); transition: transform .15s ease;
  }
  .island.locked{ background: radial-gradient(circle at 35% 30%, #a3adb2, var(--locked)); cursor:not-allowed; filter: saturate(.5); }
  .island.spotlight{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 6px 14px rgba(0,0,0,.35), 0 0 0 0 rgba(212,175,55,.6); }
    50%{ box-shadow:0 6px 14px rgba(0,0,0,.35), 0 0 0 10px rgba(212,175,55,0); }
  }
  .island:active{ transform: translate(-50%,-50%) scale(.94); }
  .island .num{ font-size:12px; color:var(--wood-dark); line-height:1; }
  .island .icon{ font-size:14px; line-height:1; margin-top:1px; }
  .island.shake{ animation: shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform: translate(-50%,-50%); }
    25%{ transform: translate(-58%,-50%); }
    75%{ transform: translate(-42%,-50%); }
  }
  .flag{ position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:14px; }

  .captain-marker{
    position:absolute; width:46px; height:46px; transform: translate(-50%,-115%);
    border-radius:8px; overflow:hidden; border:2px solid #fff8e8;
    box-shadow:0 4px 10px rgba(0,0,0,.4); animation: bobtiny 2s ease-in-out infinite;
    transition: left 1.15s cubic-bezier(.45,.05,.55,.95), top 1.15s cubic-bezier(.45,.05,.55,.95);
    z-index:5;
  }
  .captain-marker img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes bobtiny{ 0%,100%{ margin-top:0; } 50%{ margin-top:-5px; } }
  .captain-marker.walking{ animation: hop .32s ease-in-out infinite; }
  @keyframes hop{
    0%,100%{ margin-top:0; transform: translate(-50%,-115%) rotate(-7deg); }
    50%{ margin-top:-13px; transform: translate(-50%,-115%) rotate(7deg); }
  }
  .dust{
    position:absolute; width:7px; height:7px; border-radius:50%; background: rgba(255,255,255,.85);
    animation: dustfade .55s ease-out forwards; pointer-events:none; z-index:4; transform:translate(-50%,-50%);
  }
  @keyframes dustfade{
    0%{ opacity:.85; transform: translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(2.2) translateY(8px); }
  }
  .map-hint{ text-align:center; font-size:13px; color:rgba(239,226,194,.75); margin: 0 0 14px; min-height:18px; }

  /* ===== QUIZ ===== */
  .marks{ display:flex; justify-content:center; gap:8px; margin: 2px 0 16px; }
  .mark{
    width:30px;height:30px; border-radius:50%; border:2px solid var(--wood);
    display:flex;align-items:center;justify-content:center; font-family:'Black Han Sans', sans-serif;
    font-size:11px; color:var(--wood); background:rgba(255,255,255,.3);
  }
  .mark.done{ background:var(--gold); color:#3d2716; border-color:#a9822a; }
  .mark.current{ box-shadow:0 0 0 3px rgba(212,175,55,.5); }
  .q-tag-wrap{ text-align:center; }
  .q-tag{
    font-family:'Black Han Sans', sans-serif; font-size:12px; color:#fff; background:var(--sea-deep);
    display:inline-block; padding:4px 10px; border-radius:20px; margin:0 auto 12px;
  }
  .q-text{ font-size:16.5px; font-weight:700; text-align:center; margin:0 0 16px; line-height:1.55; }
  .options{ display:flex; flex-direction:column; gap:9px; }
  .opt{
    font-family:'Nanum Myeongjo', serif; font-size:14.5px; text-align:left; padding:12px 13px;
    border-radius:9px; border:2px solid var(--wood); background:rgba(255,255,255,.45);
    cursor:pointer; transition: background .15s ease, transform .08s ease;
  }
  .opt:active{ transform: scale(.98); }
  .opt.correct{ background:var(--right); color:#fff; border-color:var(--right); }
  .opt.wrong{ background:var(--wrong); color:#fff; border-color:var(--wrong); }
  .opt[disabled]{ pointer-events:none; }
  .feedback{ margin-top:12px; text-align:center; font-size:13.5px; min-height:20px; color:var(--wood-dark); font-weight:700; }

  /* ===== COMPLETE ===== */
  .center{ text-align:center; }
  .stamp{
    font-family:'Black Han Sans', sans-serif; font-size:26px; color:var(--wrong);
    border:5px solid var(--wrong); border-radius:12px; display:inline-block; padding:6px 16px;
    transform: rotate(-8deg) scale(0); margin: 0 auto 14px;
    animation: stampIn .45s .3s cubic-bezier(.2,1.6,.4,1) forwards; letter-spacing:2px;
  }
  @keyframes stampIn{ to{ transform: rotate(-8deg) scale(1); } }
  .captain-wrap{ text-align:center; margin-bottom:8px; }
  .captain-wrap img{
    width:120px; height:auto; border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.35);
    animation: bob 3.4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-1deg); } 50%{ transform: translateY(-8px) rotate(1deg); } }
  .score{ font-family:'Black Han Sans', sans-serif; font-size:14px; color:var(--wood-dark); margin-bottom:12px; }
  p.lead{ text-align:center; font-size:14.5px; line-height:1.6; margin:0 0 18px; color:var(--ink); }
  .locked-msg{
    background:rgba(255,255,255,.4); border:1px dashed var(--wood); border-radius:9px;
    padding:16px; text-align:center; font-size:14px; color:var(--wood-dark);
  }

  /* 게임성 강화: 오답 시 화면 흔들림 효과 */
  .screen-shake {
    animation: errorShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes errorShake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); background-color: rgba(139,46,46,0.1); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate3d(8px, 0, 0); }
  }

  /* ===== PLATFORMER (퀘스트 004+) ===== */
  .plat-wrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; margin-bottom:10px;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.15); background:#8ec9e8; }
  #plat-canvas{ display:block; width:100%; height:auto; }
  .plat-hud{
    position:absolute; top:8px; left:8px; z-index:6;
    background:rgba(11,51,80,.85); color:#efe2c2; font-family:'Black Han Sans', sans-serif;
    font-size:11px; padding:5px 10px; border-radius:20px; letter-spacing:1px;
  }
  .plat-fact-box{
    position:absolute; left:8px; right:8px; bottom:8px; z-index:8;
    background:rgba(239,226,194,.98); border:3px solid var(--wood); border-radius:10px;
    padding:14px 16px; font-size:14.5px; line-height:1.6; color:var(--ink);
    display:none; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .plat-fact-box.show{ display:block; }
  .plat-dim{
    position:absolute; inset:0; background:rgba(11,17,25,.55); z-index:7;
    display:none; pointer-events:none;
  }
  .plat-dim.show{ display:block; }
  .plat-controls{ display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:14px; }
  .plat-controls .side{ display:flex; gap:8px; }
  .ctrl-btn{
    width:60px; height:50px; border-radius:10px; border:2px solid var(--wood-dark);
    background:linear-gradient(180deg,#efe2c2,#ddc794); font-size:20px; color:var(--wood-dark);
    display:flex; align-items:center; justify-content:center; user-select:none; touch-action:none;
  }
  .ctrl-btn:active{ background:linear-gradient(180deg,#ddc794,#c9a05c); }
  .ctrl-btn.jump{ background:linear-gradient(180deg,#a9702f,#7c4d1e); color:#fff8e8; width:90px; }
  .ctrl-btn.jump:active{ background:linear-gradient(180deg,#7c4d1e,#5a3712); }
</style>
</head>
<body>

<div class="stage">
  <div class="plank-frame">
    <div class="card">

      <div class="screen active" id="screen-map">
        <div class="eyebrow">CAPTAIN'S CHART</div>
        <h1>아빠의 퀘스트 지도</h1>
        <div class="rope-divider"></div>
        <div class="map-outer">
          <div class="progress-badge" id="progress-badge">0 / 100</div>
          <div class="map-scroll" id="map-scroll">
            <div class="map-world" id="map-world">
              <svg id="map-svg" viewBox="0 0 400 400" preserveAspectRatio="none">
                <polyline id="path-line" points="" fill="none" stroke="#efe2c2" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.85"/>
              </svg>
              <div class="captain-marker" id="captain-marker"><img src="" alt="선장" id="captain-img"></div>
            </div>
          </div>
        </div>
        <div class="map-hint" id="map-hint">지도를 위아래로 넘기면서 섬을 눌러봐.</div>
      </div>

      <div class="screen" id="screen-locked">
        <div class="eyebrow" id="locked-tag"></div>
        <h1 id="locked-title"></h1>
        <div class="rope-divider"></div>
        <div class="locked-msg" id="locked-msg"></div>
        <div style="flex:1"></div>
        <button class="btn secondary" onclick="backToMap()">지도로 돌아가기</button>
      </div>

      <div class="screen" id="screen-quiz">
        <div class="eyebrow" id="quiz-eyebrow">QUEST</div>
        <h1 id="quiz-title"></h1>
        <div class="rope-divider"></div>
        <div class="marks" id="marks"></div>
        <div class="q-tag-wrap"><span class="q-tag" id="q-tag"></span></div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="screen" id="screen-platform">
        <div class="eyebrow" id="plat-eyebrow">QUEST</div>
        <h1 id="plat-title"></h1>
        <div class="rope-divider"></div>
        <div class="plat-wrap" id="plat-wrap">
          <div class="plat-hud" id="plat-hud">나침반 조각 0 / 3</div>
          <canvas id="plat-canvas" width="380" height="200"></canvas>
          <div class="plat-dim" id="plat-dim"></div>
          <div class="plat-fact-box" id="plat-fact-box"></div>
        </div>
        <div class="plat-controls">
          <div class="side">
            <button class="ctrl-btn" id="plat-left">◀</button>
            <button class="ctrl-btn" id="plat-right">▶</button>
          </div>
          <button class="ctrl-btn jump" id="plat-jump">점프</button>
        </div>
        <div class="feedback" id="plat-feedback"></div>
      </div>

      <div class="screen" id="screen-complete">
        <div class="center"><div class="stamp">퀘스트 완료</div></div>
        <div class="captain-wrap"><img id="complete-img" src="" alt="선장"></div>
        <div class="center score" id="score-text"></div>
        <p class="lead" id="complete-msg"></p>
        <button class="btn secondary" onclick="backToMap()">지도로 돌아가기</button>
      </div>

    </div>
  </div>
</div>

<script>
/* ---------- 실제 콘텐츠가 있는 퀘스트만 여기에 채워넣는다 ---------- */
const QUEST_CONTENT = {
  1: {
    title: "장례식장에 갈 때",
    questions: [
      { tag:"미션 001-1 · 옷차림", text:"갑자기 연락받고 급하게 나가야 해. 뭘 입고 가야 할까?",
        options:[
          {text:"어두운 색으로 통일하고, 화려한 무늬·액세서리는 뺀다", correct:true},
          {text:"무늬만 화려하지 않으면 아무 옷이나 괜찮다", correct:false},
          {text:"편한 청바지에 운동화면 충분하다", correct:false}],
        right:"정답! 검은 정장이 정석이지만, 급할 땐 어두운 톤 통일이 최소한이야.",
        wrong:"땡. 어두운 색으로 통일하고, 화려한 건 다 빼는 게 최소한의 예의야." },
      { tag:"미션 001-2 · 향", text:"향에 불을 붙였어. 이제 어떻게 꺼야 할까?",
        options:[
          {text:"입으로 후 불어서 끈다", correct:false},
          {text:"손으로 살살 흔들어서 끈다", correct:true},
          {text:"그냥 타서 꺼질 때까지 놔둔다", correct:false}],
        right:"정답! 입으로 부는 건 제일 많이들 틀리는 실수야.",
        wrong:"땡. 입으로 불면 안 돼. 손으로 살살 흔들어서 꺼야 해." },
      { tag:"미션 001-3 · 말", text:"상주 앞에 섰어. 무슨 말을 해야 위로가 될까?",
        options:[
          {text:"\"호상이네요, 그래도 다행이에요\"라고 말한다", correct:false},
          {text:"\"뭐라 드릴 말씀이 없습니다\" 정도만 하고 손을 잡아준다", correct:true},
          {text:"어쩌다 돌아가셨는지 자세히 여쭤본다", correct:false}],
        right:"정답! 말을 아끼는 게 최고의 위로야.",
        wrong:"땡. 호상이란 말도, 자세히 묻는 것도 안 돼. 말은 아끼고 손을 잡아줘." }
    ]
  },
  2: {
    title: "게임인 척 다가온 도박",
    questions: [
      { tag:"미션 002-1 · 들어오는 길", text:"도박은 \"도박하세요\"라고 광고하지 않아. 어떤 길로 슬쩍 들어올까?",
        options:[
          {text:"불법 웹툰·영화 사이트 배너, SNS 스포츠 영상 사이 광고, 친구가 보낸 오픈채팅 링크", correct:true},
          {text:"정식 앱스토어에 올라온 유명 게임 광고", correct:false},
          {text:"학교에서 나눠주는 안내문", correct:false}],
        right:"정답! 특히 낯선 링크는 누가 보내든 누르기 전에 한 번 물어봐야 해.",
        wrong:"땡. 불법 사이트 배너, SNS 사이 광고, 친구가 보낸 링크. 이 세 가지가 주된 통로야." },
      { tag:"미션 002-2 · 게임과 도박", text:"천 원짜리 소액이고 처음 몇 번은 이겼어. 이건 게임일까 도박일까?",
        options:[
          {text:"소액이고 이기고 있으니 게임이다", correct:false},
          {text:"돈이 걸린 순간부터 도박이다. 그냥 나온다", correct:true},
          {text:"실력을 쌓으면 이길 수 있으니 계속해본다", correct:false}],
        right:"정답! 처음 이기게 해주는 게 설계야. 판단하려 들지 말고 그냥 나오는 게 맞아.",
        wrong:"땡. 돈이 걸리는 순간 그건 이미 게임이 아니야. 구조상 나만 손해 보게 되어 있어." },
      { tag:"미션 002-3 · 친구가 빠졌을 때", text:"친구가 도박에 빠졌대. \"아무한테도 말하지 마\"라며 돈을 빌려달래. 어떻게 할까?",
        options:[
          {text:"딱 한 번만 빌려주고 비밀은 지켜준다", correct:false},
          {text:"돈은 안 빌려주고, 둘이서 조용히 해결해본다", correct:false},
          {text:"돈은 절대 안 빌려주고, \"어른한테 같이 가자\"고 말한다", correct:true}],
        right:"정답! 지켜줘야 할 비밀이 아니야. 알리는 게 친구를 지키는 방법이야.",
        wrong:"땡. 돈은 절대 빌려주지 말고, 혼자 해결하려 하지 말고, 반드시 어른한테 알려야 해." }
    ]
  },
  3: {

const TOTAL_QUESTS = 100;

/* 이 파일이 어느 퀘스트용인지. 폴더별 복사본마다 이 숫자만 바꾸면 됨.
   (URL에 ?q=번호 가 붙어있으면 그게 우선한다) */
const DEFAULT_QUEST = 4;

/* ---------- 100개 섬 좌표를 구불구불한 길로 자동 생성 ---------- */
function buildQuests(){
  const list = [];
  const rowH = 62;           // 퀘스트 하나당 세로 간격
  const topPad = 50, botPad = 50;
  for(let i = 1; i <= TOTAL_QUESTS; i++){
    const x = 200 + Math.sin(i * 0.55) * 130;   // 좌우로 구불구불
    const y = topPad + (i - 1) * rowH;
    const content = QUEST_CONTENT[i];
    list.push({
      id: i,
      title: content ? content.title : "다음 퀘스트",
      x, y,
      questions: content ? content.questions : null,
      type: content ? content.type : null,
      platform: content ? content.platform : null
    });
  }
  return { quests: list, worldHeight: topPad + (TOTAL_QUESTS - 1) * rowH + botPad };
}
const { quests, worldHeight } = buildQuests();

function el(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el(id).classList.add('active');
}
function questById(id){ return quests.find(q => q.id === id); }
function firstPublished(){ return quests.find(q => q.questions) || quests[0]; }
function isPublished(q){ return !!(q.questions || q.platform); }
/* 순차 잠금: 001은 항상 가능, 이 파일의 기본 퀘스트(DEFAULT_QUEST)도 항상 가능,
   나머지는 바로 이전 퀘스트를 깨야만 가능 */
function canPlay(q){
  return isPublished(q) && (q.id === 1 || q.id === DEFAULT_QUEST || completed.includes(q.id - 1));
}

/* map-world 는 실제 픽셀 컨테이너. viewBox 좌표(0~400, 0~worldHeight)를 그대로 %로 환산 */
function pct(q){ return { left: (q.x/400*100) + '%', top: (q.y/worldHeight*100) + '%' }; }

/* ---------- 지도 렌더링 ---------- */
function renderMap(spotlightId){
  const world = el('map-world');
  world.style.aspectRatio = '400 / ' + worldHeight;
  world.querySelectorAll('.island').forEach(n => n.remove());

  el('map-svg').setAttribute('viewBox', '0 0 400 ' + worldHeight);
  const pts = quests.map(q => q.x + ',' + q.y).join(' ');
  el('path-line').setAttribute('points', pts);

  quests.forEach(q => {
    const done = completed.includes(q.id);
    const playable = canPlay(q);
    const div = document.createElement('div');
    div.className = 'island' + (!playable ? ' locked' : '') + (spotlightId === q.id ? ' spotlight' : '');
    const p = pct(q);
    div.style.left = p.left; div.style.top = p.top;
    div.innerHTML =
      (done ? '<div class="flag">🚩</div>' : '') +
      '<div class="num">' + String(q.id).padStart(3,'0') + '</div>' +
      '<div class="icon">' + (done ? '✔' : (playable ? '❗' : '🔒')) + '</div>';
    div.onclick = () => onIslandClick(q, div);
    world.appendChild(div);
  });

  positionCaptain(captainAt);
  el('progress-badge').textContent = completed.length + ' / ' + TOTAL_QUESTS;
}

function positionCaptain(questId){
  const q = questById(questId);
  const p = pct(q);
  const marker = el('captain-marker');
  marker.style.left = p.left; marker.style.top = p.top;
  el('captain-img').src = CAPTAIN_SRC;
}

function spawnDust(x, y){
  const world = el('map-world');
  for(let i=0;i<3;i++){
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = (x/400*100) + '%'; d.style.top = (y/worldHeight*100) + '%';
    d.style.animationDelay = (i*0.08)+'s';
    world.appendChild(d);
    setTimeout(() => d.remove(), 700);
  }
}

function walkCaptainTo(targetId, onDone){
  const marker = el('captain-marker');
  const from = questById(captainAt);
  const target = questById(targetId);
  marker.classList.add('walking');
  spawnDust(from.x, from.y);
  requestAnimationFrame(() => {
    const p = pct(target);
    marker.style.left = p.left; marker.style.top = p.top;
  });
  setTimeout(() => {
    marker.classList.remove('walking');
    spawnDust(target.x, target.y);
    captainAt = targetId;
    saveCaptainAt();
    if(onDone) onDone();
  }, 1200);
}

/* 스크롤 지도에서 특정 섬이 가운데쯤 보이도록 스크롤 */
function scrollToQuest(questId, smooth){
  const q = questById(questId);
  const scroller = el('map-scroll');
  const worldPxHeight = el('map-world').getBoundingClientRect().height;
  const targetTopPx = (q.y / worldHeight) * worldPxHeight;
  const viewportH = scroller.clientHeight;
  const scrollTarget = Math.max(0, targetTopPx - viewportH * 0.5);
  scroller.scrollTo({ top: scrollTarget, behavior: smooth ? 'smooth' : 'auto' });
}

function onIslandClick(q, div){
  if(!canPlay(q)){
    div.classList.add('shake');
    setTimeout(() => div.classList.remove('shake'), 350);
    el('map-hint').textContent = isPublished(q)
      ? '이전 퀘스트부터 차례로 깨야 열려.'
      : '아직 공개되지 않은 퀘스트야.';
    return;
  }
  el('map-hint').textContent = '';
  if(captainAt === q.id){
    startQuest(q);
  } else {
    walkCaptainTo(q.id, () => startQuest(q));
  }
}

/* ---------- 퀴즈 진행 ---------- */
function startQuest(q){
  activeQuest = q; qCurrent = 0; qCorrect = 0;
  if(q.type === 'platform'){
    el('plat-eyebrow').textContent = 'QUEST ' + String(q.id).padStart(3,'0');
    el('plat-title').textContent = q.title;
    showScreen('screen-platform');
    startPlatformer(q);
  } else {
    el('quiz-eyebrow').textContent = 'QUEST ' + String(q.id).padStart(3,'0');
    el('quiz-title').textContent = q.title;
    showScreen('screen-quiz');
    renderQuestion();
  }
}

function renderMarks(){
  const marks = el('marks');
  marks.innerHTML = '';
  activeQuest.questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'mark' + (i < qCurrent ? ' done' : '') + (i === qCurrent ? ' current' : '');
    d.textContent = String(activeQuest.id).padStart(3,'0') + '-' + (i+1);
    marks.appendChild(d);
  });
}

function renderQuestion(){
  renderMarks();
  const q = activeQuest.questions[qCurrent];
  el('q-tag').textContent = q.tag;
  el('q-text').textContent = q.text;
  el('feedback').textContent = '';
  const opts = el('options');
  opts.innerHTML = '';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o.text;
    b.onclick = () => answer(o, b);
    opts.appendChild(b);
  });
}

function answer(o, btn){
  document.querySelectorAll('.opt').forEach(b => b.setAttribute('disabled','true'));
  const q = activeQuest.questions[qCurrent];
  if(o.correct){
    btn.classList.add('correct'); qCorrect++;
    el('feedback').textContent = q.right;
  } else {
    btn.classList.add('wrong');
    el('feedback').textContent = q.wrong;

    // 오답 시 화면 흔들림 효과 부여 (게임성 강화)
    const quizScreen = el('screen-quiz');
    quizScreen.classList.add('screen-shake');
    setTimeout(() => quizScreen.classList.remove('screen-shake'), 400);

    document.querySelectorAll('.opt').forEach(b => {
      if(b.textContent === q.options.find(x=>x.correct).text) b.classList.add('correct');
    });
  }
  setTimeout(() => {
    qCurrent++;
    if(qCurrent < activeQuest.questions.length) renderQuestion();
    else finishQuest();
  }, 1400);
}

function finishQuest(){
  if(!completed.includes(activeQuest.id)) completed.push(activeQuest.id);
  saveCompleted();
  const total = activeQuest.questions.length;
  el('complete-img').src = CAPTAIN_SRC;
  el('score-text').textContent = total + '문제 중 ' + qCorrect + '개 맞음';
  let msg;
  if(qCorrect === total) msg = '완벽하네. 이 정도면 진짜 배에 태워도 되겠어.';
  else if(qCorrect >= 1) msg = '얼추 아는구나. 다음에 또 확인해봐도 좋아.';
  else msg = '음... 편지를 다시 한 번 읽고 와야겠는데?';
  el('complete-msg').textContent = msg;
  showScreen('screen-complete');
}

function backToMap(){
  stopPlatformer();
  el('map-hint').textContent = '지도를 위아래로 넘기면서 섬을 눌러봐.';
  renderMap();
  showScreen('screen-map');
  requestAnimationFrame(() => scrollToQuest(captainAt, false));
}

/* =========================================================
   플랫포머 엔진 (퀘스트 004+ : 실제 좌우이동 + 점프)
   ========================================================= */
const PLAT = {
  raf:null, canvas:null, ctx:null,
  W:380, H:200, GROUND_Y:170,
  GRAVITY:0.55, JUMP_V:-10.5, MOVE_SPEED:2.6,
  worldWidth:0,
  player:{x:30,y:0,w:24,h:32,vx:0,vy:0,grounded:false,facing:1},
  platforms:[], facts:[], pipe:{x:0,y:0,w:34,h:46},
  factsCollected:0, factBoxTimer:null,
  inputLeft:false, inputRight:false, jumpQueued:false,
  camX:0, done:false, entering:false,
  walkPhase:0
};

function buildPlatformLevel(q){
  const pf = q.platform;
  PLAT.worldWidth = pf.pipeX + 220;
  PLAT.platforms = [
    { x:0, y:PLAT.GROUND_Y, w:PLAT.worldWidth, h:30 } // 바닥은 끊기지 않음 (안 죽음)
  ];
  pf.facts.forEach((f) => {
    PLAT.platforms.push({ x:f.x-60, y:PLAT.GROUND_Y-55, w:120, h:14 });
  });
  // 각 자리마다 정답 한자 + 오답(미끼) 한자를 함께 배치
  PLAT.facts = [];
  pf.facts.forEach((f) => {
    PLAT.facts.push({
      x:f.x-24, y:PLAT.GROUND_Y-55-26, w:26, h:26,
      text:f.text, symbol:f.symbol, correct:true, collected:false, flashTs:0
    });
    PLAT.facts.push({
      x:f.x+24, y:PLAT.GROUND_Y-55-26, w:26, h:26,
      text:null, symbol:f.decoySymbol, correct:false, collected:false, flashTs:0
    });
  });
  PLAT.pipe = { x:pf.pipeX, y:PLAT.GROUND_Y-46, w:34, h:46 };
  PLAT.factsCollected = 0;
  PLAT.totalRealFacts = pf.facts.length;
  PLAT.done = false;
  PLAT.entering = false;
  PLAT.player = { x:30, y:PLAT.GROUND_Y-32, w:24, h:32, vx:0, vy:0, grounded:true, facing:1, squash:0 };
  PLAT.camX = 0;
  PLAT.walkPhase = 0;
}

function startPlatformer(q){
  const canvas = el('plat-canvas');
  PLAT.canvas = canvas;
  PLAT.ctx = canvas.getContext('2d');
  el('plat-hud').textContent = '한자 조각 0 / ' + q.platform.facts.length;
  el('plat-fact-box').classList.remove('show');
  el('plat-feedback').textContent = '';

  buildPlatformLevel(q);
  bindPlatformControls();

  if(PLAT.raf) cancelAnimationFrame(PLAT.raf);
  PLAT.lastTs = performance.now();
  PLAT.raf = requestAnimationFrame(platformLoop);
}

function stopPlatformer(){
  if(PLAT.raf){ cancelAnimationFrame(PLAT.raf); PLAT.raf = null; }
  PLAT.inputLeft = false; PLAT.inputRight = false;
}

let platformControlsBound = false;
function bindPlatformControls(){
  if(platformControlsBound) return;
  platformControlsBound = true;

  const setL = (v) => { PLAT.inputLeft = v; };
  const setR = (v) => { PLAT.inputRight = v; };
  const doJump = () => { PLAT.jumpQueued = true; };

  const bindHoldBtn = (id, downFn, upFn) => {
    const btn = el(id);
    const start = (ev) => { ev.preventDefault(); downFn(); };
    const stop = (ev) => { if(ev) ev.preventDefault(); if(upFn) upFn(); };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
  };
  bindHoldBtn('plat-left', () => setL(true), () => setL(false));
  bindHoldBtn('plat-right', () => setR(true), () => setR(false));
  el('plat-jump').addEventListener('pointerdown', (ev) => { ev.preventDefault(); doJump(); });

  window.addEventListener('keydown', (e) => {
    if(!el('screen-platform').classList.contains('active')) return;
    if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
    if(e.key === 'ArrowLeft') setL(true);
    if(e.key === 'ArrowRight') setR(true);
    if(e.key === 'ArrowUp' || e.key === ' ') doJump();
  });
  window.addEventListener('keyup', (e) => {
    if(e.key === 'ArrowLeft') setL(false);
    if(e.key === 'ArrowRight') setR(false);
  });
  window.addEventListener('blur', () => { PLAT.inputLeft = false; PLAT.inputRight = false; });
}

function platformLoop(ts){
  if(!el('screen-platform').classList.contains('active')){
    PLAT.raf = requestAnimationFrame(platformLoop);
    return;
  }
  updatePlatformer();
  renderPlatformer();
  PLAT.raf = requestAnimationFrame(platformLoop);
}

function updatePlatformer(){
  const p = PLAT.player;
  if(!PLAT.done && !PLAT.entering){
    p.vx = 0;
    if(PLAT.inputLeft){ p.vx = -PLAT.MOVE_SPEED; p.facing = -1; }
    if(PLAT.inputRight){ p.vx = PLAT.MOVE_SPEED; p.facing = 1; }
    if(p.knockback){
      p.x += p.knockback;
      p.knockback *= 0.82;
      if(Math.abs(p.knockback) < 0.3) p.knockback = 0;
    } else {
      p.x += p.vx;
    }
    p.x = Math.max(0, Math.min(PLAT.worldWidth - p.w, p.x));

    if(p.vx !== 0) PLAT.walkPhase += 0.22; // 걷는 다리 애니메이션 진행

    if(PLAT.jumpQueued){
      if(p.grounded){ p.vy = PLAT.JUMP_V; p.grounded = false; }
      PLAT.jumpQueued = false;
    }

    // 떨어질 땐 더 빠르게 (통통 튀는 점프감)
    p.vy += (p.vy > 0) ? PLAT.GRAVITY * 1.5 : PLAT.GRAVITY;
    const prevBottom = p.y + p.h;
    const wasGrounded = p.grounded;
    p.y += p.vy;
    p.grounded = false;

    const newBottom = p.y + p.h;
    PLAT.platforms.forEach(pl => {
      const overlapX = p.x + p.w > pl.x && p.x < pl.x + pl.w;
      if(overlapX && p.vy >= 0 && prevBottom <= pl.y + 1 && newBottom >= pl.y){
        p.y = pl.y - p.h;
        p.vy = 0;
        p.grounded = true;
      }
    });
    if(p.grounded && !wasGrounded) p.squash = 1; // 착지 스쿼시 트리거
    if(p.squash > 0) p.squash *= 0.75;

    // 한자 조각 판정 (정답 / 오답 미끼)
    PLAT.facts.forEach(f => {
      if(f.collected) return;
      const hit = p.x < f.x + f.w && p.x + p.w > f.x && p.y < f.y + f.h && p.y + p.h > f.y;
      if(hit){
        if(f.correct){
          f.collected = true;
          PLAT.factsCollected++;
          el('plat-hud').textContent = '한자 조각 ' + PLAT.factsCollected + ' / ' + PLAT.totalRealFacts;
          showPlatformFact(f.symbol + '  ' + f.text);
        } else {
          f.flashTs = performance.now();
          const dir = (p.x + p.w/2 < f.x + f.w/2) ? -1 : 1;
          p.knockback = dir * 9;
          p.vy = -6;
          el('plat-feedback').textContent = '땡! 그 글자는 아니야. 포스팅 내용 떠올려서 다시 골라봐.';
        }
      }
    });

    // 파이프 도달 체크
    const pipe = PLAT.pipe;
    const hitPipe = p.x + p.w > pipe.x + 4 && p.x < pipe.x + pipe.w - 4 && p.y + p.h > pipe.y + 6;
    if(hitPipe){
      if(PLAT.factsCollected >= PLAT.totalRealFacts){
        startPipeEntry();
      } else {
        el('plat-feedback').textContent = '아직 다 모으지 못한 한자가 있어. 羅·針·盤 세 글자를 다 먹어야 파이프가 열려.';
      }
    }
  }

  // 카메라
  const half = PLAT.W/2;
  PLAT.camX = Math.max(0, Math.min(PLAT.worldWidth - PLAT.W, p.x + p.w/2 - half));
}

function startPipeEntry(){
  if(PLAT.entering) return;
  PLAT.entering = true;
  const p = PLAT.player;
  const pipe = PLAT.pipe;
  const targetX = pipe.x + pipe.w/2 - p.w/2;
  const startX = p.x;
  const duration = 550;
  const t0 = performance.now();

  function step(ts){
    const t = Math.min(1, (ts - t0) / duration);
    p.x = startX + (targetX - startX) * t;
    if(t >= 1){
      p.sinking = true;
      sinkIntoPipe();
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function sinkIntoPipe(){
  const p = PLAT.player;
  const baseY = p.y;
  const duration = 420;
  const t0 = performance.now();
  function step(ts){
    const t = Math.min(1, (ts - t0) / duration);
    p.y = baseY + (PLAT.pipe.h + 10) * t;
    p.scaleY = 1 - t*0.5;
    if(t >= 1){
      PLAT.done = true;
      finishPlatformQuest();
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function showPlatformFact(text){
  const box = el('plat-fact-box');
  const dim = el('plat-dim');
  box.textContent = text;
  box.classList.add('show');
  dim.classList.add('show');
  if(PLAT.factBoxTimer) clearTimeout(PLAT.factBoxTimer);
  PLAT.factBoxTimer = setTimeout(() => {
    box.classList.remove('show');
    dim.classList.remove('show');
  }, 4600);
}

/* 직접 그리는 2D 선장 캐릭터 — 귀엽고 읽기 쉬운 치비(chibi) 스타일 */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawCaptainSprite(ctx, w, h, facing, moving, grounded, walkPhase, squash){
  ctx.save();
  ctx.scale(facing, 1);
  const sq = squash || 0;
  ctx.scale(1 + sq*0.18, 1 - sq*0.18); // 착지 스쿼시

  const legSwing = grounded && moving ? Math.sin(walkPhase) * (h*0.13) : 0;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(0, h*0.52, w*0.32, h*0.06, 0, 0, Math.PI*2);
  ctx.fill();

  // 다리 (짧고 통통, 걸을 때 교차)
  ctx.strokeStyle = '#241a10'; ctx.lineWidth = 2;
  ctx.fillStyle = '#3d2716';
  roundRectPath(ctx, -w*0.20, h*0.30 + legSwing, w*0.16, h*0.20 - legSwing, 5);
  ctx.fill(); ctx.stroke();
  roundRectPath(ctx, w*0.04, h*0.30 - legSwing, w*0.16, h*0.20 + legSwing, 5);
  ctx.fill(); ctx.stroke();

  // 몸통 (둥글고 통통한 빨간 코트)
  ctx.fillStyle = '#c23b3b';
  roundRectPath(ctx, -w*0.30, -h*0.02, w*0.60, h*0.36, w*0.16);
  ctx.fill();
  ctx.strokeStyle = '#5a1414'; ctx.lineWidth = 2.5; ctx.stroke();
  // 코트 단추
  ctx.fillStyle = '#f4d35e';
  [0.06, 0.16].forEach(t => {
    ctx.beginPath(); ctx.arc(0, -h*0.02 + h*0.36*t + h*0.05, w*0.045, 0, Math.PI*2); ctx.fill();
  });

  // 팔 + 후크
  ctx.fillStyle = '#a83232';
  roundRectPath(ctx, w*0.26, h*0.0, w*0.13, h*0.24, 6);
  ctx.fill(); ctx.strokeStyle = '#5a1414'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#c7c7c7';
  ctx.beginPath();
  ctx.arc(w*0.34, h*0.24, w*0.07, 0.1*Math.PI, 1.3*Math.PI);
  ctx.lineWidth = w*0.045; ctx.strokeStyle = '#8a8a8a'; ctx.stroke();

  // 머리 (크고 둥근 치비 얼굴)
  const headY = -h*0.28;
  ctx.fillStyle = '#f6c99a';
  ctx.beginPath();
  ctx.arc(0, headY, w*0.34, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#c98a54'; ctx.lineWidth = 2; ctx.stroke();

  // 볼터치
  ctx.fillStyle = 'rgba(230,110,110,.55)';
  ctx.beginPath(); ctx.arc(-w*0.16, headY+h*0.04, w*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.16, headY+h*0.04, w*0.06, 0, Math.PI*2); ctx.fill();

  // 눈 (크고 동그란 눈, 반짝임 있는 귀여운 눈)
  ctx.fillStyle = '#241a10';
  ctx.beginPath(); ctx.arc(-w*0.11, headY-h*0.01, w*0.055, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.14, headY-h*0.01, w*0.055, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-w*0.095, headY-h*0.025, w*0.018, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.155, headY-h*0.025, w*0.018, 0, Math.PI*2); ctx.fill();

  // 작은 콧수염 (선장 느낌)
  ctx.strokeStyle = '#3d2716'; ctx.lineWidth = w*0.035; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-w*0.10, headY+h*0.10); ctx.quadraticCurveTo(0, headY+h*0.15, w*0.10, headY+h*0.10);
  ctx.stroke();

  // 삼각모 (귀여운 통통한 실루엣, 노란 별 장식)
  ctx.fillStyle = '#2a1d10';
  ctx.beginPath();
  ctx.moveTo(-w*0.42, headY-h*0.10);
  ctx.quadraticCurveTo(0, headY-h*0.44, w*0.42, headY-h*0.10);
  ctx.quadraticCurveTo(0, headY-h*0.20, -w*0.42, headY-h*0.10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#150d06'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#f4d35e';
  ctx.beginPath();
  const starX=0, starY=headY-h*0.24, sr=w*0.045;
  for(let i=0;i<5;i++){
    const ang = -Math.PI/2 + i*(2*Math.PI/5);
    const ang2 = ang + Math.PI/5;
    ctx.lineTo(starX+Math.cos(ang)*sr, starY+Math.sin(ang)*sr);
    ctx.lineTo(starX+Math.cos(ang2)*sr*0.45, starY+Math.sin(ang2)*sr*0.45);
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function renderPlatformer(){
  const ctx = PLAT.ctx;
  const W = PLAT.W, H = PLAT.H, cam = PLAT.camX;
  ctx.clearRect(0,0,W,H);

  // 하늘/바다 배경
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#bfe3f2');
  grad.addColorStop(0.6, '#8ec9e8');
  grad.addColorStop(1, '#5aa0c9');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-cam, 0);

  // 바닥/발판
  PLAT.platforms.forEach(pl => {
    ctx.fillStyle = '#5a3a24';
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle = '#7c4d1e';
    ctx.fillRect(pl.x, pl.y, pl.w, 5);
  });

  // 한자 조각 (정답 = 금테, 오답 미끼 = 흐릿한 회색톤 + 맞으면 빨갛게 반짝)
  PLAT.facts.forEach(f => {
    if(f.collected) return;
    const sinceFlash = performance.now() - f.flashTs;
    const flashing = f.flashTs && sinceFlash < 260;
    ctx.save();
    ctx.translate(f.x + f.w/2, f.y + f.h/2);
    ctx.translate(0, Math.sin(performance.now()/300 + f.x)*3);
    ctx.fillStyle = flashing ? '#e08a8a' : (f.correct ? '#efe2c2' : '#d9cdb0');
    ctx.strokeStyle = flashing ? '#8b2e2e' : (f.correct ? '#d4af37' : '#8a7d5e');
    ctx.lineWidth = f.correct ? 2.5 : 2;
    ctx.beginPath();
    ctx.arc(0,0,14,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = f.correct ? '#8b2e2e' : '#6b6152';
    ctx.font = 'bold 16px "Nanum Myeongjo", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.symbol, 0, 1);
    ctx.restore();
  });

  // 파이프 (마리오식) — 조각 다 모으면 초록, 아니면 회색
  const pipe = PLAT.pipe;
  const allDone = PLAT.factsCollected >= PLAT.totalRealFacts;
  const pipeBody = allDone ? '#2e6b3e' : '#7d8a91';
  const pipeCap = allDone ? '#3a8a52' : '#93a0a6';
  ctx.fillStyle = pipeBody;
  ctx.fillRect(pipe.x+4, pipe.y+10, pipe.w-8, pipe.h-10);
  ctx.fillStyle = pipeCap;
  ctx.fillRect(pipe.x, pipe.y, pipe.w, 14);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(pipe.x, pipe.y+10, 5, pipe.h-10);
  // 파이프 안쪽 어둠
  ctx.fillStyle = '#1a1208';
  ctx.fillRect(pipe.x+8, pipe.y+14, pipe.w-16, 6);

  // 플레이어
  const p = PLAT.player;
  const moving = (PLAT.inputLeft || PLAT.inputRight) && !PLAT.entering;
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2 + (p.h/2) * ( (p.scaleY!==undefined) ? (1-p.scaleY) : 0));
  if(p.scaleY !== undefined) ctx.scale(1, p.scaleY);
  drawCaptainSprite(ctx, p.w*2.1, p.h*1.9, p.facing, moving, p.grounded, PLAT.walkPhase, p.squash || 0);
  ctx.restore();

  ctx.restore();
}

function finishPlatformQuest(){
  stopPlatformer();
  if(!completed.includes(activeQuest.id)) completed.push(activeQuest.id);
  saveCompleted();
  const total = PLAT.totalRealFacts;
  el('complete-img').src = CAPTAIN_SRC;
  el('score-text').textContent = '羅針盤 — 한자 ' + PLAT.factsCollected + ' / ' + total + ' 조각 모음';
  el('complete-msg').textContent = '나침반은 매번 정답을 주진 않아도, 흔들리지 않는 기준 하나는 알려줘. 오늘 그 세 글자를 다 모아서 파이프를 통과했어.';
  showScreen('screen-complete');
}


/* ---------- 초기 진입: URL의 ?q=번호 로 바로 그 퀘스트로 스크롤+진입 (순차 잠금 검사 포함) ---------- */
function init(){
  completed = loadCompleted();
  captainAt = loadCaptainAt();

  const params = new URLSearchParams(window.location.search);
  const qParam = parseInt(params.get('q'), 10);
  const targetId = qParam || DEFAULT_QUEST;
  const target = targetId ? questById(targetId) : null;

  renderMap(target && canPlay(target) ? target.id : null);
  showScreen('screen-map');

  requestAnimationFrame(() => {
    if(target && canPlay(target)){
      scrollToQuest(target.id, false);
      el('map-hint').textContent = '';
      setTimeout(() => {
        if(captainAt === target.id){
          setTimeout(() => startQuest(target), 450);
        } else {
          walkCaptainTo(target.id, () => setTimeout(() => startQuest(target), 250));
        }
      }, 350);
    } else if(target && !canPlay(target)){
      scrollToQuest(target.id, false);
      el('locked-tag').textContent = 'QUEST ' + String(target.id).padStart(3,'0');
      el('locked-title').textContent = target.title;
      el('locked-msg').textContent = isPublished(target)
        ? '이 퀘스트를 열려면 이전 퀘스트부터 차례로 깨야 해. 지도에서 지금 열려있는 섬부터 시작해봐.'
        : '아직 지도에 그려지지 않은 섬이야. 다음에 다시 와줘.';
      showScreen('screen-locked');
    } else {
      scrollToQuest(captainAt, false);
    }
  });
}

init();
</script>

</body>
</html>
