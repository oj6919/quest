<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>김진호 박사의 퇴근 전쟁</title>
<link href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css" rel="stylesheet">
<style>
  :root{
    --bg-dark:#0a0a0a; --panel:#1a1c23; --screen:#000;
    --hyundai-blue:#002c5f; --steel-gray:#8a9097; --accent:#f2a900;
    --road:#2c2f33; --water:#1c3d5a; --grass:#2b4a2d; --line:#f4d35e;
    --text-main:#e0e0e0; --danger:#d32f2f; --safe:#388e3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: #111; font-family: 'NeoDunggeunmo', monospace; color:var(--text-main);
    display:flex; align-items:center; justify-content:center; padding:10px; overflow-x:hidden;
  }
  .arcade-cabinet{
    width:100%; max-width:420px; position:relative; background: linear-gradient(180deg, #333, #111);
    border: 8px solid #222; border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.1); padding: 15px;
  }
  .screen-bezel{
    background: var(--screen); border: 15px solid #050505; border-radius: 20px;
    border-bottom-width: 30px; position:relative; overflow: hidden; min-height: 600px;
    display:flex; flex-direction:column; box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
  }
  .screen-content{ display:none; flex-direction:column; flex:1; padding: 20px 15px; position: relative; z-index: 10; }
  .screen-content.active{ display:flex; }
  .title-area{ text-align:center; margin-top: 20px; }
  .corp-tag{ background: var(--hyundai-blue); color: white; display: inline-block; padding: 4px 10px; font-size: 14px; border-radius: 2px; margin-bottom: 15px; border: 2px solid #fff;}
  .main-title{ font-size:38px; color:#fff; text-shadow: 3px 3px 0 var(--hyundai-blue), 6px 6px 0 #000; margin: 0 0 10px 0; line-height: 1.2; }
  .sub-title{ font-size:16px; color:var(--accent); margin-bottom: 30px; }
  .retro-panel{ background: rgba(255,255,255,0.1); border: 2px dashed var(--steel-gray); padding: 15px; margin-bottom: 20px; border-radius: 4px; }
  .route-info{ display:flex; justify-content:space-between; align-items:center; font-size: 18px; margin-bottom:15px;}
  .driver-info{ font-size: 14px; line-height: 1.8; color: #ccc;}
  .highlight{ color: var(--accent); }
  .blink-text{ text-align: center; font-size: 20px; color: #fff; margin-top: auto; margin-bottom: 20px; animation: blink 1s step-end infinite; cursor: pointer; }
  @keyframes blink{ 50%{ opacity: 0; } }
  .top-hud{ display:flex; justify-content:space-between; font-size:14px; color:var(--accent); margin-bottom:10px; }
  .mental-gauge-wrap{ display:flex; align-items:center; gap:10px; margin-bottom: 10px;}
  .mental-label{ font-size: 14px; color: #fff; }
  .mental-track{ flex:1; height:18px; background:#222; border: 2px solid #fff; padding:2px;}
  .mental-fill{ height:100%; width:100%; background:var(--safe); transition: width 0.2s; }
  .progress-wrap{ position:relative; height:20px; border:2px solid var(--steel-gray); margin-bottom:5px; background:#111;}
  .progress-fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:var(--hyundai-blue); }
  .progress-marker{ position:absolute; top:-2px; transform:translateX(-50%); font-size:16px; }
  .location-alert{ text-align:center; font-size:14px; color:#ff4500; height:16px; margin-bottom:10px; font-weight:bold; }
  .canvas-container{ position:relative; flex:1; border: 2px solid #fff; overflow:hidden; background:#000; }
  #game-canvas{ display:block; width:100%; height:100%; object-fit: cover; }
  .game-controls{ display:flex; gap:10px; margin-top:15px; }
  .ctrl-btn{ flex:1; padding: 15px; background: #333; border: 4px outset #666; color: #fff; font-family: 'NeoDunggeunmo', monospace; font-size: 24px; cursor: pointer; user-select:none; touch-action:manipulation; }
  .ctrl-btn:active{ border-style: inset; background: #222; }
  .toast{ position:absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid var(--accent); color: #fff; padding: 8px 15px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space:nowrap; }
  .toast.show{ opacity: 1; }
  .result-title{ font-size: 32px; text-align: center; margin-top: 40px; margin-bottom: 20px;}
  .result-text{ font-size: 16px; text-align: center; line-height: 1.6; color: #ccc; margin-bottom: 30px;}
  .stats-box{ background: #222; border: 2px solid #fff; padding: 20px; font-size: 18px; line-height: 2; margin-bottom: 30px;}
</style>
</head>
<body>
<div class="arcade-cabinet">
  <div class="screen-bezel">
    
    <!-- START SCREEN -->
    <div class="screen-content active" id="scr-start">
      <div class="title-area">
        <div class="corp-tag">HYUNDAI STEEL</div>
        <h1 class="main-title">김진호 박사의<br>퇴근 전쟁</h1>
        <div class="sub-title">당진에서 탕정까지, 무사 귀환 프로젝트</div>
      </div>
      <div class="retro-panel">
        <div class="route-info"><span>당진 제철소</span> <span>▶▶</span> <span>탕정 아파트</span></div>
        <div class="driver-info">
          - 드라이버: <span class="highlight">김진호 박사</span><br>
          - 탑승차량: <span class="highlight">제네시스 G80</span><br>
          - 핵심루트: <b>삽교호 방조제 통과</b> (3차선 주의)<br>
          - 조작방법: ← → 버튼(또는 방향키)
        </div>
      </div>
      <div class="blink-text" id="btn-start">INSERT COIN (CLICK TO START)</div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen-content" id="scr-game" style="padding: 10px;">
      <div class="top-hud">
        <span id="hud-dist">0 km / 44 km</span>
        <span id="hud-speed">0 km/h</span>
      </div>
      <div class="mental-gauge-wrap">
        <span class="mental-label">MENTAL</span>
        <div class="mental-track"><div class="mental-fill" id="mental-fill"></div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-marker" id="progress-car" style="left:0%;">🚙</div>
        <div class="progress-marker" style="right:-10px;">🏠</div>
      </div>
      <div class="location-alert" id="loc-alert"></div>
      
      <div class="canvas-container">
        <canvas id="game-canvas" width="320" height="400"></canvas>
        <div class="toast" id="toast"></div>
      </div>
      <div class="game-controls">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>
    </div>

    <!-- END SCREEN -->
    <div class="screen-content" id="scr-end">
      <h1 class="result-title" id="end-title" style="color:var(--danger)">GAME OVER</h1>
      <div class="result-text" id="end-msg">멘탈이 붕괴되어 차를 갓길에 세웠습니다.</div>
      <div class="stats-box">
        주행 거리: <span class="highlight" id="end-dist">0 km</span><br>
        소요 시간: <span class="highlight" id="end-time">0 초</span>
      </div>
      <div class="blink-text" id="btn-retry">PRESS HERE TO RESTART</div>
    </div>

  </div>
</div>

<script>
const W = 320, H = 400, LANES = 3, TARGET_DIST = 44000;
let state = {
  raf: null, ctx: null, running: false, dist: 0, speed: 100, maxSpeed: 180,
  mental: 100, lane: 1, laneX: W/2, targetX: W/2,
  objects: [], roadY: 0, shake: 0, lastTime: 0, startTime: 0, toastTimer: null,
  zone: 0 // 0: Dangjin, 1: Sapgyo, 2: Inju, 3: Tangjeong
};

const OBJ_TYPES = [
  { id:'truck', type:'crash', label:'과적화물', w:60, h:80, dmg:100, prob:2 },
  { id:'pothole', type:'damage', label:'포트홀', w:40, h:30, dmg:25, msg:'타이어 파손!', prob:3 },
  { id:'boss1', type:'stress', label:'공장장📞', w:45, h:45, dmg:20, msg:'공장장: "보고서 어딨어?"', prob:3 },
  { id:'coffee', type:'heal', label:'아아🥤', w:30, h:40, heal:15, msg:'아아 수혈!', prob:4 }
];

function getRndObj(zone){
  let types = [...OBJ_TYPES];
  if(zone === 0) types[0].prob = 6; // 공단 화물차 증가
  if(zone === 2) types[1].prob = 6; // 교차로 포트홀 증가
  if(zone === 3) types[2].prob = 8; // 도착 임박 스트레스 증가
  
  let total = types.reduce((sum, o)=>sum+o.prob, 0);
  let r = Math.random()*total;
  for(let o of types){ if(r < o.prob) return o; r -= o.prob; }
  return types[0];
}

function getEl(id){ return document.getElementById(id); }
function setScreen(id){
  document.querySelectorAll('.screen-content').forEach(el=>el.classList.remove('active'));
  getEl(id).classList.add('active');
}
function showToast(msg){
  let t = getEl('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), 1500);
}
function getLaneX(idx){ return (W/LANES)*idx + (W/LANES)/2; }

function startGame(){
  state.ctx = getEl('game-canvas').getContext('2d');
  state.dist = 0; state.speed = 100; state.mental = 100;
  state.lane = 1; state.laneX = getLaneX(1); state.targetX = state.laneX;
  state.objects = []; state.roadY = 0; state.shake = 0;
  state.startTime = performance.now(); state.lastTime = performance.now();
  state.running = true;
  updateHUD(); setScreen('scr-game');
  if(state.raf) cancelAnimationFrame(state.raf);
  state.raf = requestAnimationFrame(loop);
}

function moveLane(dir){
  if(!state.running) return;
  let next = Math.max(0, Math.min(LANES-1, state.lane + dir));
  
  // 삽교호 방조제(Zone 1) 강제 액션: 3차선 진입 불가 로직
  if(state.zone === 1 && next === 2) {
    showToast("⚠️ 삽교호 방조제: 3차선 공사중!");
    state.shake = 10; state.mental -= 10;
    return;
  }
  
  if(next !== state.lane){ state.lane = next; state.targetX = getLaneX(next); }
}

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') moveLane(-1);
  if(e.key==='ArrowRight') moveLane(1);
});
getEl('btn-left').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(-1); });
getEl('btn-right').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(1); });
getEl('btn-start').addEventListener('click', startGame);
getEl('btn-retry').addEventListener('click', startGame);

function loop(ts){
  let dt = Math.min(50, ts - state.lastTime);
  state.lastTime = ts;
  if(state.running) update(dt, ts);
  draw();
  if(state.running || state.shake > 0) state.raf = requestAnimationFrame(loop);
}

function update(dt, ts){
  let ratio = state.dist / TARGET_DIST;
  state.speed = 100 + (state.maxSpeed - 100) * ratio;
  state.mental -= (2.0 * (dt/1000)); 
  if(state.mental <= 0){ gameOver("멘탈 붕괴! 너무 지쳐서 갓길에 정차했습니다."); return; }

  let moveDist = (state.speed * 12) * (dt/1000); 
  state.dist += moveDist; state.roadY += moveDist;
  if(state.dist >= TARGET_DIST){ gameWin(); return; }

  // Zone Logic (분기점 이벤트 처리)
  let alertText = "";
  if(ratio < 0.25) { state.zone = 0; alertText = "[당진 산단] 화물차 주의 구간"; }
  else if(ratio < 0.5) { state.zone = 1; alertText = "🚨 [삽교호 진입] 3차선 폐쇄 구간 🚨"; }
  else if(ratio < 0.75) { state.zone = 2; alertText = "[인주 교차로] 요철 주의 구간"; }
  else { state.zone = 3; alertText = "[아산 탕정] 시내 진입 - 업무 전화 폭주"; }
  getEl('loc-alert').textContent = alertText;

  // 삽교호 강제 이동 (3차선에 있으면 튕겨냄)
  if(state.zone === 1 && state.lane === 2) {
      state.lane = 1; state.targetX = getLaneX(1);
      state.shake = 15; state.mental -= 2;
  }

  state.laneX += (state.targetX - state.laneX) * 0.15;

  let spawnRate = (state.zone === 2) ? 600 : Math.max(400, 1000 - ratio*500);
  if(!state.lastSpawn || ts - state.lastSpawn > spawnRate){
    // 삽교호 구간(1)에서는 3차선(lane 2) 스폰 제외
    let targetLane = Math.floor(Math.random()*LANES);
    if(state.zone === 1 && targetLane === 2) targetLane = Math.floor(Math.random()*2);
    
    state.objects.push({ obj: getRndObj(state.zone), lane: targetLane, y: -100, hit: false });
    state.lastSpawn = ts;
  }

  let carY = H - 80, carW = 34, carH = 68;
  for(let i = state.objects.length-1; i>=0; i--){
    let o = state.objects[i];
    let objSpeed = (state.zone === 2) ? 6 : 4; // 인주교차로(2)에서 장애물 접근 속도 증가
    o.y += (state.speed * objSpeed) * (dt/1000); 
    
    let ox = getLaneX(o.lane);
    if(!o.hit && Math.abs(ox - state.laneX) < (o.obj.w/2 + carW/2 - 5) && Math.abs(o.y - carY) < (o.obj.h/2 + carH/2 - 5)){
      o.hit = true;
      if(o.obj.msg) showToast(o.obj.msg);
      if(o.obj.type === 'crash'){
        state.shake = 15; gameOver("과적 화물차와 추돌했습니다!"); return;
      } else if(o.obj.type === 'damage' || o.obj.type === 'stress'){
        state.shake = 8; state.mental -= o.obj.dmg;
        if(state.mental <= 0){ gameOver("스트레스 한계치 도달!"); return; }
      } else if(o.obj.type === 'heal'){
        state.mental = Math.min(100, state.mental + o.obj.heal);
      }
    }
    if(o.y > H + 100) state.objects.splice(i, 1);
  }
  if(state.shake > 0) state.shake *= 0.8;
  updateHUD();
}

function updateHUD(){
  getEl('hud-dist').textContent = (state.dist/1000).toFixed(1) + " / 44.0 km";
  getEl('hud-speed').textContent = Math.round(state.speed) + " km/h";
  let mFill = getEl('mental-fill');
  mFill.style.width = Math.max(0, state.mental) + "%";
  mFill.style.background = state.mental > 50 ? "var(--safe)" : (state.mental > 20 ? "var(--accent)" : "var(--danger)");
  let pct = (state.dist / TARGET_DIST) * 100;
  getEl('progress-fill').style.width = pct + "%";
  getEl('progress-car').style.left = pct + "%";
}

function gameOver(msg){
  state.running = false;
  setTimeout(()=>{
    setScreen('scr-end');
    getEl('end-title').textContent = "퇴근 실패"; getEl('end-title').style.color = "var(--danger)";
    getEl('end-msg').textContent = msg;
    getEl('end-dist').textContent = (state.dist/1000).toFixed(1) + " km";
    getEl('end-time').textContent = Math.round((performance.now()-state.startTime)/1000) + " 초";
  }, 1000);
}

function gameWin(){
  state.running = false; 
  setTimeout(()=>{
    setScreen('scr-end');
    getEl('end-title').textContent = "무사 귀환"; getEl('end-title').style.color = "var(--safe)";
    getEl('end-msg').textContent = "탕정 아파트에 무사히 도착했습니다! 수고하셨습니다.";
    getEl('end-dist').textContent = "44.0 km (완주)";
    getEl('end-time').textContent = Math.round((performance.now()-state.startTime)/1000) + " 초";
  }, 500);
}

// 렌더링 호환성을 위해 roundRect 대신 구형 브라우저 대응 함수 직접 구현
function drawSafeRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath(); ctx.fill();
}

function draw(){
  let ctx = state.ctx;
  if(!ctx) return;
  ctx.save();
  if(state.shake > 0.5) ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);

  // 삽교호 방조제 구간(Zone 1)은 바다 렌더링 적용
  ctx.fillStyle = (state.zone === 1) ? 'var(--water)' : 'var(--grass)';
  ctx.fillRect(0,0,W,H);

  let roadW = W * 0.7; let roadX = (W - roadW)/2;
  ctx.fillStyle = 'var(--road)'; ctx.fillRect(roadX, 0, roadW, H);
  
  // 삽교호 방조제 구간: 3차선 공사 바리케이드 표시
  if(state.zone === 1) {
    ctx.fillStyle = '#ff4500'; 
    ctx.fillRect(roadX + (roadW/3)*2, 0, roadW/3, H);
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 0.5;
    for(let sy=0; sy<H; sy+=40) {
      ctx.fillRect(roadX + (roadW/3)*2, (sy + state.roadY)%H, roadW/3, 20);
    }
    ctx.globalAlpha = 1.0;
  }

  ctx.strokeStyle = 'var(--line)'; ctx.lineWidth = 4;
  ctx.setLineDash([20, 20]); ctx.lineDashOffset = -state.roadY % 40;
  ctx.beginPath();
  for(let i=1; i<LANES; i++){
    let x = roadX + (roadW/LANES)*i;
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  ctx.stroke(); ctx.setLineDash([]);

  state.objects.forEach(o => {
    ctx.save(); ctx.translate(getLaneX(o.lane), o.y);
    drawObject(ctx, o.obj);
    ctx.restore();
  });

  drawG80(ctx, state.laneX, H - 80);
  ctx.restore();
}

function drawG80(ctx, x, y){
  ctx.save(); ctx.translate(x, y);
  let w = 34, h = 68;
  
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(-w/2-2, -h/2-2, w+4, h+4);
  
  ctx.fillStyle = '#101820'; 
  drawSafeRect(ctx, -w/2, -h/2, w, h, 6);
  
  ctx.fillStyle = '#0a0a0a';
  drawSafeRect(ctx, -w*0.4, -h*0.25, w*0.8, h*0.5, 4);
  
  ctx.fillStyle = '#a0a5a9';
  ctx.beginPath(); 
  ctx.moveTo(0, -h*0.5); ctx.lineTo(w*0.25, -h*0.48); ctx.lineTo(w*0.15, -h*0.42);
  ctx.lineTo(-w*0.15, -h*0.42); ctx.lineTo(-w*0.25, -h*0.48); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-w*0.45, -h*0.47, w*0.15, 2); ctx.fillRect(-w*0.45, -h*0.43, w*0.15, 2);
  ctx.fillRect(w*0.3, -h*0.47, w*0.15, 2); ctx.fillRect(w*0.3, -h*0.43, w*0.15, 2);

  ctx.fillStyle = '#ff0000';
  ctx.fillRect(-w*0.45, h*0.43, w*0.2, 2); ctx.fillRect(-w*0.45, h*0.47, w*0.2, 2);
  ctx.fillRect(w*0.25, h*0.43, w*0.2, 2); ctx.fillRect(w*0.25, h*0.47, w*0.2, 2);
  ctx.restore();
}

function drawObject(ctx, obj){
  ctx.fillStyle = '#fff';
  if(obj.id === 'truck'){
    ctx.fillStyle = '#ddd'; ctx.fillRect(-obj.w/2, -obj.h/2, obj.w, obj.h);
    ctx.fillStyle = '#8b4513'; ctx.fillRect(-obj.w/2+2, -obj.h/2+2, obj.w-4, obj.h-20);
    ctx.fillStyle = '#333'; ctx.fillRect(-obj.w/2, obj.h/2-15, obj.w, 15);
  } else if(obj.id === 'pothole'){
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(0,0, obj.w/2, obj.h/2, 0, 0, Math.PI*2); ctx.fill();
  } else if(obj.type === 'stress'){
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0, obj.w/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = '20px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('😡', 0, 0);
  } else if(obj.type === 'heal'){
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0, obj.w/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = '20px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('☕', 0, 0);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(-25, obj.h/2 + 2, 50, 14);
  ctx.fillStyle = (obj.type==='heal')?'#0f0':(obj.type==='stress'?'#f00':'#ff0');
  ctx.font = '10px "NeoDunggeunmo"'; ctx.textAlign = 'center'; ctx.fillText(obj.label, 0, obj.h/2 + 12);
}
